<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full Index — DSA Quest</title>
<script>try{var t=localStorage.getItem("dsaquest_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231b160e%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 text-anchor=%22middle%22 fill=%22%23dd9752%22 font-family=%22monospace%22>DQ</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="nav-mount"></div>

<div class="topic-hero container">
  <div class="crumb"><a href="index.html">Index</a> / Full catalogue</div>
  <h1>Every problem, one systematic list</h1>
  <p class="blurb2">Search, filter by sheet or difficulty, and track what's solved. This is the flattened view of the same roadmap.</p>
</div>

<div class="section container" style="padding-top:20px;">
  <div class="filter-bar">
    <input type="search" id="f-search" placeholder="Search problems or tags…" />
    <select id="f-topic"></select>
    <div class="tab-group">
      <button class="chip active" data-diff="all">All</button>
      <button class="chip" data-diff="Easy">Easy</button>
      <button class="chip" data-diff="Medium">Medium</button>
      <button class="chip" data-diff="Hard">Hard</button>
    </div>
    <div class="tab-group">
      <button class="chip active" data-status="all">All</button>
      <button class="chip" data-status="solved">Solved</button>
      <button class="chip" data-status="unsolved">Unsolved</button>
    </div>
  </div>
  <p id="result-count" class="mono" style="color:var(--ink-faint); font-size:.8rem; margin-bottom:10px;"></p>
  <div class="panel" style="padding:14px; overflow-x:auto;">
    <table class="problem-table" id="problem-table"></table>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/problems.js"></script>
<script>
  renderNav("problems.html");
  renderFooter();
  initProblemsPage();
</script>
</body>
</html>
