<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Progress — DSA Quest</title>
<script>try{var t=localStorage.getItem("dsaquest_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231b160e%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 text-anchor=%22middle%22 fill=%22%23dd9752%22 font-family=%22monospace%22>DQ</text></svg>" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="nav-mount"></div>

<div class="topic-hero container">
  <div class="crumb"><a href="index.html">Index</a> / Progress</div>
  <h1>Your Progress</h1>
  <p class="blurb2">Everything here lives in your browser's local storage — private to this device, nothing is uploaded anywhere.</p>
</div>

<div class="section container" style="padding-top:20px;">
  <div class="level-hero" id="level-hero"></div>
  <div class="dash-grid" id="dash-grid"></div>

  <div class="panel" style="margin-top:26px;">
    <span class="kicker">Progress by sheet</span>
    <p style="color:var(--ink-dim); font-size:.9rem; margin-top:-6px;">Where you stand in each volume.</p>
    <div class="topic-bars" id="topic-bars"></div>
  </div>

  <div class="panel" style="margin-top:26px;">
    <span class="kicker">Inspection stamps</span>
    <p style="color:var(--ink-dim); font-size:.9rem; margin-top:-6px;">Earned by solving problems and staying consistent.</p>
    <div class="badge-grid" id="badge-grid"></div>
  </div>

  <div style="text-align:center; margin-top:30px;">
    <button class="btn btn-ghost" id="reset-btn">Reset all progress</button>
  </div>
</div>

<div id="footer-mount"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  renderNav("progress.html");
  renderFooter();

  function renderProgressPage() {
    const s = computeStats();

    document.getElementById("level-hero").innerHTML = `
      <div class="level-badge"><b>${s.level}</b><span>Level</span></div>
      <div class="level-info">
        <h3>${s.title}</h3>
        <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${(s.xpIntoLevel / s.xpForNext) * 100}%"></div></div>
        <p class="xp-caption">${s.xpIntoLevel} / ${s.xpForNext} XP to Level ${s.level + 1} · ${s.xp} XP total</p>
      </div>
    `;

    document.getElementById("dash-grid").innerHTML = `
      <div class="dash-card"><b>${s.solvedCount}</b><span>Solved</span></div>
      <div class="dash-card"><b>${s.totalProblems - s.solvedCount}</b><span>Remaining</span></div>
      <div class="dash-card"><b>${s.pct}%</b><span>Complete</span></div>
      <div class="dash-card"><b>${s.streak}</b><span>Day streak</span></div>
    `;

    document.getElementById("topic-bars").innerHTML = getAllTopics()
      .filter((t) => t.problems.length)
      .map((t) => {
        const st = topicStats(t.id);
        return `
        <div class="topic-bar-row">
          <span class="name">${t.title}</span>
          <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${st.pct}%"></div></div>
          <span class="pct2">${st.solved}/${st.total}</span>
        </div>`;
      }).join("");

    document.getElementById("badge-grid").innerHTML = getBadges().map((b) => `
      <div class="badge-item ${b.unlocked ? "unlocked" : ""}">
        <span class="stamp-circle mono">${b.code}</span>
        <b>${b.name}</b>
        <span>${b.desc}</span>
      </div>
    `).join("");
  }

  document.getElementById("reset-btn").addEventListener("click", () => {
    if (confirm("This will erase all solved problems, notes, and badges on this device. Continue?")) {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem("dsaquest_seen_badges");
      renderProgressPage();
      renderNav("progress.html");
      toast("Progress reset.");
    }
  });

  renderProgressPage();
</script>
</body>
</html>
